[workspace]
resolver = "2"
members = [
    "bridge-cli",
    "bridge-sdk/eth-proof",
    "bridge-sdk/near-rpc-client",
    "bridge-sdk/bridge-clients/solana-bridge-client",
    "bridge-sdk/bridge-clients/near-bridge-client",
    "bridge-sdk/bridge-clients/evm-bridge-client",
    "bridge-sdk/bridge-clients/wormhole-bridge-client",
    "bridge-sdk/bridge-clients/utxo-bridge-client",
    "bridge-sdk/bridge-clients/starknet-bridge-client",
    "bridge-sdk/bridge-clients/aptos-bridge-client",
    "bridge-sdk/bridge-clients/hypercore-bridge-client",
    "bridge-sdk/crypto-utils",
    "bridge-sdk/utxo-utils",
    "bridge-sdk/light-client",
    "bridge-sdk/btc-utils"
]
exclude = ["vendor/bip32"]

[workspace.dependencies]
sha3 = "0.10.8"
sha2 = "0.10.8"
bitcoincore-rpc = "0.19.0"
bitcoin = { version = "0.32.5", features = ["serde"] }
borsh = "1.6.0"
bincode = "1.3"
thiserror = "2.0.3"
alloy = { version = "1.1", features = ["full"] }
k256 = "0.13"
ethereum-types = "0.14.1"
tokio = { version = "1.38.0", features = ["full"] }
serde = { version = "1.0" }
hex = "0.4.3"
serde_json = "1.0.117"
reqwest = { version = "0.12", features = ["json"] }
cita_trie = "5.0.1"
rlp = "0.5.2"
hasher = "0.1.4"
lazy_static = "1.4.0"
merkle-tools = { git = "https://github.com/Near-One/btc-light-client-contract", tag = "v0.2.0" }
minreq = { version = "2.12.0", features = ["https"] }
near-jsonrpc-client = "0.20.0"
near-jsonrpc-primitives = "0.34.2"
near-primitives = "0.34.2"
near-crypto = "0.34.2"
# near-sdk 5.28.1 hard-errors at compile time unless built in a recognized context
# (cargo-near / wasm / unit-testing / non-contract-usage). This workspace consumes
# near-sdk as a plain library, so enable `non-contract-usage` (the sanctioned feature
# for that; pulls near-crypto / near-primitives-core interop). Not a source patch.
near-sdk = { version = "5.28.1", features = ["non-contract-usage"] }
derive_builder = "0.20.0"
clap = { version = "4.5", features = ["derive"] }
dotenv = { version = "0.15" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
near-token = "0.3"
near-contract-standards = "5.5"
omni-types = { git = "https://github.com/near-one/omni-bridge", package = "omni-types", rev = "f499d46c2d58869e4cbb5d19cff703ff7d2731d6" }
starknet = "0.17.0"
serde_with = { version = "3.12.0", features = ["schemars_0_8"] }
solana-sdk = "4.0.1"
solana-rpc-client = "4.1.2"
solana-rpc-client-api = "4.1.2"
solana-system-interface = "3.2.0"
solana-transaction-status-client-types = "4.1.2"
solana-pubkey = { version = "4.2.0", features = ["curve25519", "sha2", "borsh"] }
solana-instruction = { version = "3.4.0", features = ["borsh"] }
solana-message = { version = "4.3.0", features = ["serde", "wincode", "blake3"] }
solana-transaction = { version = "4.1.5", features = ["serde", "wincode", "verify"] }
solana-hash = "4.5.0"
solana-keypair = "3.1.2"
solana-signer = "3.0.1"
solana-signature = "3.4.1"
solana-sdk-ids = "3.1.0"
solana-program-pack = "3.1.0"
solana-program-option = "3.1.0"
solana-commitment-config = "3.1.1"
bs58 = "0.5"
spl-token = "9.0.0"
spl-token-2022-interface = "3.1.1"
spl-associated-token-account-interface = "2.0.0"
crypto-shared = { git = "https://github.com/near-one/mpc", package = "crypto-shared", rev = "463172481597ee09b12020b72c61d6b01da7b167" }
near-mpc-contract-interface = { git = "https://github.com/near/mpc", package = "near-mpc-contract-interface", rev = "dcc9e042cad6784d33cfa736afb61b876a14ded0" }
bcs = "0.1"
ed25519-dalek = "2"
openssl-sys = { version = "*", features = ["vendored"] }
light-client = { path = "bridge-sdk/light-client" }
zcash_primitives = { git = "https://github.com/Near-One/librustzcash", rev = "1bdf11549c3f788c7d14412c0be6edb204e374e2", default-features = false, features = ["circuits", "test-dependencies", "transparent-inputs", "non-standard-fees"] }
zcash_transparent = { git = "https://github.com/Near-One/librustzcash", rev = "1bdf11549c3f788c7d14412c0be6edb204e374e2", features = ["transparent-inputs"] }
zcash_protocol = { git = "https://github.com/Near-One/librustzcash", rev = "1bdf11549c3f788c7d14412c0be6edb204e374e2" }
pczt = { git = "https://github.com/Near-One/librustzcash", rev = "1bdf11549c3f788c7d14412c0be6edb204e374e2", features = ["std", "signer", "io-finalizer", "prover", "signer", "tx-extractor", "spend-finalizer", "zcp-builder"] }
zcash_address = { git = "https://github.com/Near-One/librustzcash", rev = "1bdf11549c3f788c7d14412c0be6edb204e374e2" }
zcash_encoding = { git = "https://github.com/Near-One/librustzcash", rev = "1bdf11549c3f788c7d14412c0be6edb204e374e2" }
orchard = { version = "0.15.0", default-features = false }
ripemd = "0.1.3"

# zcash (via zcash_transparent) pins bip32 =0.6.0-pre.1, which exact-pins the
# RustCrypto *pre-release* digest-0.11 chain (sha2 =0.11.0-pre.4, hmac, ripemd) and
# clashes with near-sdk 5.28.1's stable sha2 0.11. There is no stable bip32 0.6.0, and
# a [patch] can only be applied at the workspace root, so we vendor bip32 0.6.0-pre.1
# verbatim with its RustCrypto deps moved to the released stable versions. Upstream fixed
# its deps in iqlusioninc/crates@cfedeba4 but that rev also bumps secp256k1 to 0.31
# (type-clashes with zcash_transparent's 0.29) and is unpublished — the vendor stays
# until a published bip32 aligns with the zcash stack's secp256k1.
[patch.crates-io.bip32]
path = "vendor/bip32"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
# LTO is disabled deliberately: `lto = "thin"` makes rustc emit LLVM bitcode
# into the dependency rlibs, and the release runners link the non-native
# targets with foreign linkers whose LLVM LTO readers are older than rustc's
# (cargo-zigbuild's lld and Xcode's ld). Newer bitcode + older reader =
# "Unknown attribute kind" link failures on aarch64-linux (cross) and both
# macOS targets. Emitting native objects keeps every target linkable.
lto = false
